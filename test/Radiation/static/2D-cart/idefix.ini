[Grid]
X1-grid    1  0.0  400  u  1.0
X2-grid    1  0.0  2    u  1.0
X3-grid    1  0.0  0    u  1.0

[TimeIntegrator]
CFL         0.4
tstop       100.0
first_dt    1.e-6
nstages     2
# fixed_dt 1e-3

[Hydro]
solver    hllc
gamma     1.4
# csiso     userdef

[Radiation]
boundary-X1-beg    dirichlet         5.780961760245792e-06
boundary-X1-end    dirichlet         1.156192352049158e-05
boundary-X2-beg    periodic
boundary-X2-end    periodic
boundary-X3-beg    periodic
boundary-X3-end    periodic
mass               3.34792898e+27
length             14959787070000.0
velocity           32558.67752987
targetError        1.e-6
solver             BICGSTAB
maxIter            1000
mu                 2.353
kappaP             constant          0.1
kappaR             constant          0.1

[Boundary]
X1-beg    outflow
X1-end    outflow
X2-beg    periodic
X2-end    periodic
X3-beg    periodic
X3-end    periodic

[Setup]
h    0.05

[Output]
dmp_dir    ./out
vtk        -1.0
dmp        1.0
log        1
