[Grid]
X1-grid    1  2.0  64   l  10.0
X2-grid    1  0    128  u  3.141592653589793
X3-grid    1  0.0  1    u  6.283185307179586

[TimeIntegrator]
CFL         0.4
tstop       1e4
first_dt    1.e-6
nstages     2
fixed_dt    1.0

[Hydro]
solver    hllc
gamma     1.2
# csiso     userdef

[Gravity]
potential    userdef

[Units]
length      1e8
velocity    1e5
density     1.0

[Dust]
nSpecies         1
drag             size  1e-12
drag_feedback    yes
drag_implicit    yes
have_energy      true
tracer           1
alpha_coll       1.0
cV               0.1            # In units of kB/mH

[Radiation]
boundary-X1-beg    neumann    0.0
boundary-X1-end    dirichlet  7e-17
boundary-X2-beg    neumann    0.0
boundary-X2-end    neumann    0.0
boundary-X3-beg    periodic
boundary-X3-end    periodic
targetError        1.e-6
solver             PBICGSTAB
maxIter            10000
mu                 2.353
kappaP             userdef
kappaR             userdef

[Irradiation]
type     sph_short_char
kappa    userconst       41
flux     userconst       3.0e9

[Boundary]
X1-beg    userdef
X1-end    outflow
X2-beg    reflective
X2-end    reflective
X3-beg    periodic
X3-end    periodic

[Setup]
tau0                    1.0
rhoSlope                4.0
T0                      1000.0
d2g                     0.01
Lstar                   0.22
Tstar                   4677
Mstar                   0.76
a_p                     0.0134
M_p                     0.01
surface_condensation    false
grain_size              1e-4

[Output]
dmp_dir     ./out
vtk         -1.0
dmp         1e3
log         1e2
analysis    1e3
