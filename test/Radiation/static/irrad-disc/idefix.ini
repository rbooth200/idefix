[Grid]
X1-grid    1  5.0                 192  l  100.0
X2-grid    1  1.0207963267948965  48   u  1.5707963267948965
X3-grid    1  0.0                 6    u  6.283185307179586

[TimeIntegrator]
CFL         0.4
tstop       1e4
first_dt    1.e-6
nstages     2
fixed_dt    1.0

[Hydro]
solver    hllc
gamma     1.4
# csiso     userdef

[Units]
length      14959787070000.0
velocity    2.978469e6
density     5.939194093920347e-07

[Radiation]
boundary-X1-beg    neumann    0.0
boundary-X1-end    dirichlet  7e-17
boundary-X2-beg    dirichlet  7e-17
boundary-X2-end    neumann    0.0
boundary-X3-beg    periodic
boundary-X3-end    periodic
targetError        1.e-6
solver             PBICGSTAB
maxIter            10000
mu                 2.353
kappaP             constant   4.0
kappaR             constant   4.0
multigrid          F          7      2  1  1e-6  100    # type levels, smoothing iterations, repeats, inner tol, max iter.

[Irradiation]
type          sph_long_char
kappa         constant       1    13.0  1.3
luminosity    constant       0.8  0.12

[Boundary]
X1-beg    outflow
X1-end    outflow
X2-beg    periodic
X2-end    periodic
X3-beg    periodic
X3-end    periodic

[Setup]
h0            0.05
r0            5.0
kflare        0.25
Sigma0        1.2e2
SigmaSlope    1.0

[Output]
dmp_dir    ./out
vtk        -1.0
dmp        1e3
log        1e2
