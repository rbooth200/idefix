[Grid]
X1-grid    1  0.0 1000  u  1
X2-grid    1  0   1     u  3.141592653589793
X3-grid    1  0.0 1     u  6.283185307179586

[TimeIntegrator]
CFL         0.4
tstop       1e3
nstages     2
first_dt    3.092482e-2

[Hydro]
solver    hllc
gamma     1.4
# csiso     userdef

[Units]
length   1.49598e+13
velocity 2.978469e6
density  1e0

[Dust]
nSpecies         1
drag             size  6.685e-15 # 1 mm
drag_feedback    yes
drag_implicit    yes
have_energy      true
tracer           1
alpha_coll       1.0
cV               0.1    # In units of kB/mH

[Radiation]
boundary-X1-beg periodic 
boundary-X1-end periodic
boundary-X2-beg periodic
boundary-X2-end periodic
boundary-X3-beg periodic
boundary-X3-end periodic
targetError 1.e-12
solver PBICGSTAB
maxIter 10000
mu 2.353
kappaP constant 1.0  1.0
kappaR constant 1.0  1.0
fluxlimiter  one_third

[Boundary]
X1-beg    periodic
X1-end    periodic
X2-beg    periodic
X2-end    periodic
X3-beg    periodic
X3-end    periodic

[Setup]
T        30
rho      1e-12
d2g      0.1
# Eigenvector
amp      1.0e-4
drho     0 0 0 0
dvel     0 0 0 0
dTmp     0 0 0 0 
dEr      0 0 

[Output]
dmp_dir  ./out
analysis 0.1
vtk      -1.0
dmp      100
log      1000
