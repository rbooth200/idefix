[Grid]
X1-grid    1  0.0 128  u  100
X2-grid    1  0   1    u  3.141592653589793
X3-grid    1  0.0 1    u  6.283185307179586

[TimeIntegrator]
CFL         0.4
tstop       1e1
first_dt    1.e-3
nstages     2
fixed_dt    1.0e-5
fixed_dt_mult 1.01

[Hydro]
solver    hllc
gamma     1.4
# csiso     userdef

[Units]
length   1e8
velocity 1e6
density  1e0

[Dust]
nSpecies         1
drag             size  1e-13
drag_feedback    yes
drag_implicit    yes
have_energy      true
tracer           1
alpha_coll       1.0
cV               0.1    # In units of kB/mH

[Radiation]
boundary-X1-beg periodic 
boundary-X1-end periodic
boundary-X2-beg periodic
boundary-X2-end periodic
boundary-X3-beg periodic
boundary-X3-end periodic
targetError 1.e-6
solver PBICGSTAB
maxIter 10000
mu 2.353
kappaP constant 1.0  10.0
kappaR constant 1e10  1e10

[Boundary]
X1-beg    reflective
X1-end    outflow
X2-beg    reflective
X2-end    reflective
X3-beg    periodic
X3-end    periodic

[Setup]
Tgas     2000
Tdust    1700
Trad     100
d2g      0.01
rho0     1e-12
monitoring ./out/monitoring.txt


[Output]
dmp_dir ./out
vtk    -1.0
dmp    1e10
log    1e2
